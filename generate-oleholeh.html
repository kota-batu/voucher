 * Halaman publik khusus "Voucher Oleh-Oleh". Token generator sudah

 ******************************************************************/-->
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ambil Voucher Oleh-Oleh</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="appContainer">
    <div class="appTitle">Ambil Voucher Oleh-Oleh</div>

    <div id="generateFormSection">
      <form id="generateForm">
        <label class="formLabel" for="inputRecipientName">Nama Penerima (opsional)</label>
        <input class="formInput" type="text" id="inputRecipientName" />

        <label class="formLabel" for="inputOrganization">Perusahaan/Sekolah (opsional)</label>
        <input class="formInput" type="text" id="inputOrganization" />

        <button class="formButton" id="buttonGenerateVoucher" type="submit">Ambil Voucher</button>
      </form>
    </div>

    <div id="generateStatusMessage" class="statusMessage"></div>
    <div id="voucherResultSection"></div>
  </div>

  <script src="js/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/generate-oleholeh.js"></script>
</body>
</html>
